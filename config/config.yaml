# Global grid, tiling and comparability settings.
# Nothing in backend/ should repeat these values; edit here or override with a
# proof config (see config/proofs/).

grid:
  resolution_deg: 0.05
  lon_min: -180.0
  lon_max: 180.0
  lat_min: -90.0
  lat_max: 90.0
  tile_deg: 10.0
  halo_deg: 1.0
  working_pixel_m: 2000.0
  chunk_rows: 360
  chunk_cols: 720

earth:
  # The Earth land mask is the WorldClim ocean nodata mask (majority-valid rule).
  land_mask_source: bio_1
  land_mask_threshold: 0.5
  # ETOPO 2022 60 arc-second native ground sampling. Comparability is judged
  # against this, not against the finer working grid the features run on.
  native_pixel_m: 1852.0

comparability:
  # A feature is computed only where its window spans at least this many NATIVE
  # source pixels. 5 km of ETOPO (1.85 km/px) passes at 2.7 px; 5 km of MOLA
  # (3.7 km/px) fails at 1.35 px. This is what Mars' 16 ppd MOLA trips over.
  min_window_pixels: 2.5
  # Between the floor and this value the feature is still computed but flagged
  # as marginal in every profile, so a thin window is never silently trusted.
  marginal_window_pixels: 4.0
  # Hurst needs at least this many resolved lags out of the configured list.
  min_hurst_lags: 4
  # A lag must span at least this many native pixels to count as resolved.
  min_lag_pixels: 2.0
  # Percentile filters are exact at or below this window size (pixels). Above
  # it the DEM is subsampled to `approx_percentile_window_px` before filtering
  # and the result is resampled back; this keeps the 80 m lunar DEM tractable.
  exact_percentile_max_px: 64
  approx_percentile_window_px: 64

distribution:
  # Target profiles sample every Nth pixel to keep memory bounded. n_cells still
  # reports the full region count.
  sample_stride_px: 4
  # Robust spread reported for every target feature: p16-p84 is +/-1 sigma for a
  # normal distribution. Change here, not in code.
  percentiles: [16.0, 84.0]

scoring:
  # Phase 3. Absolute similarity is a Gaussian in target spreads:
  #   s_abs = exp(-0.5 * (gap / scale)^2),  gap = Earth value - target median
  # `scale` is floored so a narrow target distribution cannot make every Earth
  # cell look infinitely far away. All three terms are config, never code.
  absolute_kernel: gaussian
  spread_floor_fraction: 0.10      # floor = 10% of |target median|
  spread_floor_units:              # ... and never below these measurement floors
    relief_20km_m: 1.0
    slope_20km_deg: 0.05
    roughness_5km_m: 0.5
    roughness_10km_m: 0.5
    roughness_20km_m: 0.5
    hurst_2_32km: 0.01
    temp_mean_c: 0.1
    temp_diurnal_range_c: 0.1
    temp_max_warmest_c: 0.1
    temp_min_coldest_c: 0.1
    temp_annual_range_c: 0.1
    precip_annual_mm: 1.0
    precip_driest_month_mm: 0.1
  # Rank similarity compares an Earth cell's area-weighted percentile with the
  # Earth percentile of the TARGET MEDIAN (q). Both are percentiles of Earth
  # land, so the comparison stays scale-free.
  rank_reference: target_median_earth_percentile
  # "Rank hides a real-unit gap": rank similarity high while the absolute
  # Gaussian likeness is low. Thresholds are config, and the flag never changes
  # the score.
  hidden_gap_rank_similarity: 0.75
  hidden_gap_absolute_similarity: 0.35
  # Count area, not cells: every aggregate and percentile is weighted by
  # cos(latitude).
  area_weighting: true
  # Earth percentiles are stored as this many quantiles, which is what the site
  # cards and the engine use to map a value to a percentile (error <= 1/N).
  cdf_quantiles: 4096
  # A site's score is the area-weighted mean of cells within this fraction of
  # the suppression distance, so a single noisy cell cannot define a site.
  site_aggregation_fraction_of_separation: 0.5

thermal_sensitivity:
  # Required by the thermal decision: vary band edges and temperature weight and
  # report how much the top-N changes. Never tune these to flatter known analogs.
  temperature_weights: [0.0, 0.25, 0.5]
  band_edge_shifts_c: [-5.0, 0.0, 5.0]
  top_n: 25
  rank_sample_count: 200000
  random_seed: 7

hurst_sensitivity:
  # Earth Hurst robustness check: drop the 2 km lag (ETOPO native is ~1.85 km).
  sample_count: 600
  random_seed: 42
  patch_km: 96.0
  drop_lag_km: 2.0
  robust_max_median_difference: 0.05
  robust_min_correlation: 0.99

figures:
  stride_cells: 4
  dpi_single: 160
  dpi_overview: 150
  percentile_stretch: [2.0, 98.0]
  overview_columns: 4

storage:
  # NetCDF4/HDF5 chunk compression level (0-9). Chunk shapes come from grid.*.
  compression_level: 4

report:
  polar_circle_deg: 66.5
  plot_xticks: [-120, -60, 0, 60, 120]
  plot_yticks: [-60, -30, 0, 30, 60]
