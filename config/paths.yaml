    hurst: LDRM_80S_1000MPP_ADJ_H.tiff
    spectral_slope: LDRM_80S_1000MPP_ADJ_SPSLP.tiff
    roughness_800m: LDRM_80S_1000MPP_ADJ_ROUGH_800M.tiff
    roughness_1600m: LDRM_80S_1000MPP_ADJ_ROUGH_1600M.tiff
