    terrain: ETOPO_2022_v1_60s_N90W180_surface.tif
    climate:
      bio_1: wc2.1_2.5m_bio_1.tif
      bio_2: wc2.1_2.5m_bio_2.tif
      bio_5: wc2.1_2.5m_bio_5.tif
      bio_6: wc2.1_2.5m_bio_6.tif
      bio_7: wc2.1_2.5m_bio_7.tif
      bio_12: wc2.1_2.5m_bio_12.tif
