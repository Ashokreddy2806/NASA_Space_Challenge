# Validation / spot-check sites. Coordinates and expectations live here, not in
# pipeline or test code.

sites:
  - name: Atacama
    lat: -23.5
    lon: -68.5
    notes: hyper-arid desert
    expect:
      temp_mean_c: {max: 20.0}
      precip_annual_mm: {max: 50.0}
  - name: Dry Valleys
    lat: -77.5
    lon: 162.0
    notes: cold desert, Antarctica
    expect:
      temp_mean_c: {max: -15.0}
      precip_annual_mm: {max: 100.0}
  - name: Devon Island
    lat: 75.4
    lon: -89.5
    notes: polar desert, Mars analog
    expect:
      temp_mean_c: {max: 0.0}
  - name: Death Valley
    lat: 36.5
    lon: -116.9
    notes: hot desert
    expect:
      temp_mean_c: {min: 20.0}
      precip_annual_mm: {max: 100.0}
  - name: Iceland
    lat: 64.9
    lon: -19.0
    notes: cold and wet
    expect:
      precip_annual_mm: {min: 500.0}
  - name: Sahara
    lat: 23.0
    lon: 10.0
    notes: hot desert
    expect:
      temp_mean_c: {min: 20.0}
      precip_annual_mm: {max: 50.0}
  - name: Amazon
    lat: -3.0
    lon: -60.0
    notes: hot and wet (negative control)
    expect:
      temp_mean_c: {min: 24.0}
      precip_annual_mm: {min: 1500.0}

# Phase 3. "Famous" sites are excluded from the second top-N list so the tool
# can surface lesser-known candidates. A candidate is treated as famous when it
# falls within this radius of a listed site.
famous_radius_km: 100.0
# `reviewed` marks whether the team has confirmed the coordinate. Unreviewed
# entries are still used for the famous-site filter (they are famous either
# way) and are labelled in the report.
famous:
  - {name: Atacama, lat: -23.5, lon: -68.5, reviewed: true}
  - {name: Dry Valleys, lat: -77.5, lon: 162.0, reviewed: true}
  - {name: Devon Island, lat: 75.4, lon: -89.5, reviewed: true}
  - {name: Death Valley, lat: 36.5, lon: -116.9, reviewed: true}
  - {name: Iceland, lat: 64.9, lon: -19.0, reviewed: true}
  - {name: Sahara, lat: 23.0, lon: 10.0, reviewed: true}
  - {name: Amazon, lat: -3.0, lon: -60.0, reviewed: true}
  # Antarctic/McMurdo cluster: proposed 2026-11-15, awaiting team review.
  - {name: McMurdo Station, lat: -77.8419, lon: 166.6863, reviewed: false}
  - {name: Ross Island, lat: -77.5, lon: 168.0, reviewed: false}
  - {name: Mount Erebus, lat: -77.53, lon: 167.17, reviewed: false}
  - {name: McMurdo Dry Valleys, lat: -77.47, lon: 161.98, reviewed: false}

# Known analogs proposed for Phase 3 validation. Coordinates were reviewed on
# 2026-11-15. `display_source: false` hides the source string on site cards.
# `citation_verified` records whether the reference itself was checked; a
# source we have not checked must never be presented as verified.
analogs:
  - name: Licancabur
    lat: -22.833
    lon: -67.883
    targets: [moon, mars]
    notes: high-altitude Andean lake and volcano; cold, dry, high-UV Mars analog
    source: "Cabrol et al. 2009, J. Geophys. Res. 114, G00D06, doi:10.1029/2008JG000818"
    reviewed: true
    citation_verified: true
  - name: Rio Tinto
    lat: 37.69
    lon: -6.55
    targets: [mars]
    notes: acidic, iron-rich river basin; Meridiani Planum mineralogy analog
    source: "Fernandez-Remolar et al. 2005, Earth and Planetary Science Letters 240 — Rio Tinto basin and Meridiani Planum (from memory; spot-check before display)"
    reviewed: true
    citation_verified: false
  - name: Mistastin Lake
    lat: 55.88
    lon: -63.30
    targets: [moon]
    notes: impact structure used for lunar field training; shocked rocks and melt breccias
    source: "Mader, Osinski, Marion & Sylvester 2010, GeoCanada 2010 abstract, Mistastin Lake Crater Labrador as a Lunar Analogue Site"
    reviewed: true
    citation_verified: true
  - name: Mauna Kea summit
    lat: 19.8207
    lon: -155.4681
    targets: [moon, mars]
    notes: barren high-altitude basaltic terrain used in Apollo geology training
    source: "none cited (coordinates only)"
    reviewed: true
    citation_verified: false
    display_source: false
