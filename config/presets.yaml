# Phase 3 scoring presets. Every weight, the top-N count and the minimum
# separation between sites live here, never in code.
#
# Rules the engine enforces:
#   * A group that is unavailable for a target is dropped and the remaining
#     weights are renormalised (the profile's group table shows the same maths).
#   * `ice_proxy` is target context (the PSR area fraction). Earth has no ice
#     map, so a constant target fraction cannot rank Earth sites; its weight is
#     0 in every preset and the value is shown on the target card instead.
#   * Temperature is the qualitative band mapping approved on 2026-11-15, at a
#     low default weight. Rover mobility is defined as temperature weight 0.
#   * `dryness` is a physical constraint on both targets (no precipitation, no
#     vegetation) at weight 0.25 in the climate-aware presets. The weight is
#     config-only; it is never tuned to improve an analog's score.

presets:
  balanced:
    label: Balanced
    description: >-
      All usable feature groups. The two polar-appropriate qualitative thermal
      anchors and the no-precipitation constraint each carry low weight (0.25);
      PSR area fraction is context only.
    weights:
      relief: 1.0
      slope: 1.0
      roughness: 1.0
      scale_robust_roughness: 1.0
      temperature: 0.25
      dryness: 0.25
      ice_proxy: 0.0
    top_n: 25
    min_separation_km: 50.0

  rover_mobility:
    label: Rover mobility (terrain)
    description: >-
      Terrain traversability only: relief, slope, roughness and scale-robust
      roughness. Temperature and dryness weights are 0 by definition.
    weights:
      relief: 1.0
      slope: 1.5
      roughness: 1.0
      scale_robust_roughness: 0.5
      temperature: 0.0
      dryness: 0.0
      ice_proxy: 0.0
    top_n: 25
    min_separation_km: 50.0

  cold_trap_ice:
    label: Cold-trap / ice
    description: >-
      Terrain is background; the cold anchor and the no-precipitation constraint
      carry the weight. PSR area fraction stays context because Earth has no
      equivalent map; nothing here claims a radiation or vacuum analog.
    weights:
      relief: 0.5
      slope: 0.5
      roughness: 0.5
      scale_robust_roughness: 0.5
      temperature: 0.5
      dryness: 0.25
      ice_proxy: 0.0
    top_n: 25
    min_separation_km: 50.0

  thermal_cycling:
    label: Thermal cycling (qualitative)
    description: >-
      Temperature evidence at higher weight and terrain de-emphasised. The Moon
      has no cited polar diurnal swing, so this preset ranks the cold and warm
      polar anchors only; it is labelled qualitative everywhere it appears.
    weights:
      relief: 0.5
      slope: 0.5
      roughness: 1.0
      scale_robust_roughness: 1.0
      temperature: 0.5
      dryness: 0.0
      ice_proxy: 0.0
    top_n: 25
    min_separation_km: 50.0
