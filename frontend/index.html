<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analog Earth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&family=DM+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<div id="map" aria-label="Interactive globe"></div>

<header id="intro">
  <h1>Earth analogues of <span id="body-name">the Moon</span></h1>
  <div class="pills" role="group" aria-label="Target body">
    <button data-target="moon" class="on">Moon</button>
    <button data-target="mars">Mars</button>
  </div>
</header>

<div id="controls">
  <select id="preset" aria-label="Priority preset"></select>
  <label class="toggle"><input type="checkbox" id="famous"><span class="box"></span><span>Hide famous</span></label>
</div>

<div id="panel"></div>

<nav id="chips" aria-label="Ranked sites"></nav>
<div id="status" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="js/panel.js"></script>
<script src="js/globe.js"></script>
</body>
</html>
