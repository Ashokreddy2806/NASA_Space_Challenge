    <circle cx="698.6" cy="193.3" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="698.6" y="184.3" fill="#f8fafc" font-size="9.5" font-weight="600" text-anchor="middle" filter="url(#shadow)">Qaidam Basin Yardangs (80%)</text>

