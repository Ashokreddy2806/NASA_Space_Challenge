    <circle cx="322.3" cy="327.4" r="6" fill="#eab308" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="322.3" y="318.4" fill="#f8fafc" font-size="9.5" font-weight="600" text-anchor="middle" filter="url(#shadow)">Salar de Uyuni Salt Crust (60%)</text>

    <!-- Site: Puna Plateau Volcanic Barren -->
    <circle cx="323.2" cy="337.9" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="323.2" y="328.9" fill="#f8fafc" font-size="9.5" font-weight="600" text-anchor="middle" filter="url(#shadow)">Puna Plateau Volcanic Barren (83%)</text>

    <!-- Site: Namib Gravel Plains (Central Erg Margin) -->
    <circle cx="515.7" cy="335.3" r="6" fill="#eab308" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="515.7" y="326.3" fill="#f8fafc" font-size="9.5" font-weight="600" text-anchor="middle" filter="url(#shadow)">Namib Gravel Plains (69%)</text>

    <!-- Site: Ellesmere Island Polar Fjord Highlands -->
    <circle cx="315.5" cy="90.5" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="315.5" y="106.5" fill="#f8fafc" font-size="9.5" font-weight="600" text-anchor="middle" filter="url(#shadow)">Ellesmere Island Polar Fjord Highlands (78%)</text>

    <!-- Site: Svalbard Arctic Permafrost Plain -->
    <circle cx="516.4" cy="97.5" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="516.4" y="113.5" fill="#f8fafc" font-size="9.5" font-weight="600" text-anchor="middle" filter="url(#shadow)">Svalbard Arctic Permafrost Plain (71%)</text>

    <!-- Site: Danakil Depression Evaporite Basin -->
    <circle cx="574.0" cy="246.8" r="6" fill="#eab308" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="574.0" y="237.8" fill="#f8fafc" font-size="9.5" font-weight="600" text-anchor="middle" filter="url(#shadow)">Danakil Depression Evaporite Basin (68%)</text>


  <!-- Footer Cartographic Metadata -->
  <!-- Scale Bar & CRS -->
  <rect x="60" y="505" width="280" height="58" fill="#0f172a" rx="6" stroke="#1e293b"/>
  <text x="75" y="524" fill="#f8fafc" font-size="10.5" font-weight="600">CRS: WGS 84 (EPSG:4326) Equirectangular</text>
  <text x="75" y="540" fill="#94a3b8" font-size="9.5">Grid Resolution: 0.05° (~5 km at equator)</text>
  <line x1="75" y1="552" x2="195" y2="552" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="75" y1="548" x2="75" y2="556" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="195" y1="548" x2="195" y2="556" stroke="#cbd5e1" stroke-width="2"/>
  <text x="135" y="548" fill="#cbd5e1" font-size="8" text-anchor="middle">5,000 km</text>

  <!-- Similarity Legend -->
  <rect x="580" y="505" width="320" height="58" fill="#0f172a" rx="6" stroke="#1e293b"/>
  <text x="595" y="523" fill="#f8fafc" font-size="10.5" font-weight="600">Similarity Match Score</text>
  <rect x="595" y="531" width="240" height="10" fill="url(#scoreGrad)" rx="3"/>
  <text x="595" y="553" fill="#94a3b8" font-size="9">0% (Dissimilar)</text>
  <text x="715" y="553" fill="#94a3b8" font-size="9">50%</text>
  <text x="815" y="553" fill="#22c55e" font-size="9" font-weight="600">100% (High)</text>

  <!-- Famous vs Overlooked Legend Marker -->
  <circle cx="852" cy="536" r="4.5" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="862" y="540" fill="#cbd5e1" font-size="9">Overlooked</text>
  <circle cx="852" cy="520" r="4.5" fill="#22c55e" stroke="#facc15" stroke-width="1.5"/>
  <text x="862" y="524" fill="#cbd5e1" font-size="9">Famous</text>
</svg>