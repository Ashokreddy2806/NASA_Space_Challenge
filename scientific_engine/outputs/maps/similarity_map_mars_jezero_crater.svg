    <circle cx="548.1" cy="220.5" r="6" fill="#eab308" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="548.1" y="211.5" fill="#f8fafc" font-size="9.5" font-weight="600" text-anchor="middle" filter="url(#shadow)">Western Desert Clay Basin (68%)</text>

    <!-- Site: Beacon Valley Permafrost (Transantarctic Mtns) -->
    <circle cx="854.9" cy="461.6" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="854.9" y="452.6" fill="#f8fafc" font-size="9.5" font-weight="600" text-anchor="middle" filter="url(#shadow)">Beacon Valley Permafrost (79%)</text>

    <!-- Site: Axel Heiberg Island Cold Springs -->
    <circle cx="268.2" cy="94.7" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="268.2" y="110.7" fill="#f8fafc" font-size="9.5" font-weight="600" text-anchor="middle" filter="url(#shadow)">Axel Heiberg Island Cold Springs (79%)</text>

