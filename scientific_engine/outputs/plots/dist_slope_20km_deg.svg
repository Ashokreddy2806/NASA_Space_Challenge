<svg width="800" height="380" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <rect width="800" height="380" fill="#0f172a" rx="12"/>
  <text x="400" y="36" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="bold">Terrain Slope in 20 km Window</text>
  <text x="400" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Units: degrees | Earth 0.05° Land vs. Moon South Pole vs. Mars Landing Sites</text>

  <!-- Grid lines -->
  <line x1="140" y1="80" x2="140" y2="300" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="80" x2="720" y2="300" stroke="#334155" stroke-width="1"/>
  <line x1="140" y1="300" x2="720" y2="300" stroke="#64748b" stroke-width="2"/>

  <!-- Axis ticks -->
  <text x="140" y="322" fill="#94a3b8" font-size="11" text-anchor="middle">-0.9</text>
  <text x="430" y="322" fill="#94a3b8" font-size="11" text-anchor="middle">9.1</text>
  <text x="720" y="322" fill="#94a3b8" font-size="11" text-anchor="middle">19.2</text>

  <!-- Row 1: Earth Land (0.05 deg Grid) -->
  <text x="25" y="115" fill="#38bdf8" font-size="13" font-weight="600">Earth Land (Global)</text>
  <line x1="166.36363636363637" y1="110" x2="693.6363636363636" y2="110" stroke="#38bdf8" stroke-width="2"/>
  <rect x="169.823052835628" y="98" width="29.693324717928334" height="24" fill="#0284c7" opacity="0.4" rx="4"/>
  <line x1="175.8770316616134" y1="94" x2="175.8770316616134" y2="126" stroke="#bae6fd" stroke-width="3"/>
  <text x="175.8770316616134" y="90" fill="#bae6fd" font-size="11" text-anchor="middle">Med: 0.3</text>

  <!-- Row 2: Moon South Pole (85S-90S) -->
  <text x="25" y="165" fill="#e2e8f0" font-size="13" font-weight="600">Moon South Pole</text>
  <line x1="379.6943188031214" y1="160" x2="544.0166012227248" y2="160" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="448.8826482429544" cy="160" r="7" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <text x="448.8826482429544" y="148" fill="#f8fafc" font-size="11" text-anchor="middle">9.8</text>

  <!-- Row 3: Mars Jezero Crater -->
  <text x="25" y="215" fill="#f97316" font-size="13" font-weight="600">Mars Jezero Crater</text>
  <line x1="209.60634226353199" y1="210" x2="298.9746011233163" y2="210" stroke="#f97316" stroke-width="2"/>
  <circle cx="247.08335404344152" cy="210" r="7" fill="#ea580c" stroke="#ffedd5" stroke-width="2"/>
  <text x="247.08335404344152" y="198" fill="#ffedd5" font-size="11" text-anchor="middle">2.8</text>

  <!-- Row 4: Mars Oxia Planum -->
  <text x="25" y="265" fill="#ef4444" font-size="13" font-weight="600">Mars Oxia Planum</text>
  <line x1="189.4264128435807" y1="260" x2="218.25488344351112" y2="260" stroke="#ef4444" stroke-width="2"/>
  <circle cx="200.95780108355285" cy="260" r="7" fill="#dc2626" stroke="#fee2e2" stroke-width="2"/>
  <text x="200.95780108355285" y="248" fill="#fee2e2" font-size="11" text-anchor="middle">1.2</text>

  <!-- Legend -->
  <rect x="220" y="340" width="360" height="26" fill="#1e293b" rx="6"/>
  <rect x="235" y="348" width="14" height="10" fill="#0284c7" opacity="0.6"/>
  <text x="255" y="357" fill="#cbd5e1" font-size="10">Earth IQR (p25-p75)</text>
  <circle cx="390" cy="353" r="5" fill="#f8fafc"/>
  <text x="402" y="357" fill="#cbd5e1" font-size="10">Moon Pole</text>
  <circle cx="485" cy="353" r="5" fill="#f97316"/>
  <text x="497" y="357" fill="#cbd5e1" font-size="10">Mars Sites</text>
</svg>