  <line x1="617.116513430459" y1="94" x2="617.116513430459" y2="126" stroke="#bae6fd" stroke-width="3"/>
  <text x="617.116513430459" y="90" fill="#bae6fd" font-size="11" text-anchor="middle">Med: -0.8</text>

  <!-- Row 2: Moon South Pole (85S-90S) -->
