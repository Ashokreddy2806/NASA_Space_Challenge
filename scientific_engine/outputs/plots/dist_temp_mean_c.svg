  <line x1="166.36363636363635" y1="160" x2="262.57689803467827" y2="160" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="214.4702671991573" cy="160" r="7" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <text x="214.4702671991573" y="148" fill="#f8fafc" font-size="11" text-anchor="middle">-168.2</text>

