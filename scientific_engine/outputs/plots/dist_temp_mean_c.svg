  <circle cx="477.1324715611017" cy="210" r="7" fill="#ea580c" stroke="#ffedd5" stroke-width="2"/>
  <text x="477.1324715611017" y="198" fill="#ffedd5" font-size="11" text-anchor="middle">-59.0</text>

  <!-- Row 4: Mars Oxia Planum -->
  <text x="25" y="265" fill="#ef4444" font-size="13" font-weight="600">Mars Oxia Planum</text>
  <line x1="445.74289494092426" y1="260" x2="498.6601888599972" y2="260" stroke="#ef4444" stroke-width="2"/>
  <circle cx="473.0434079400824" cy="260" r="7" fill="#dc2626" stroke="#fee2e2" stroke-width="2"/>
