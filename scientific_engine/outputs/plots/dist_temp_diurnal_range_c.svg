<svg width="800" height="380" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <rect width="800" height="380" fill="#0f172a" rx="12"/>
  <text x="400" y="36" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="bold">Diurnal Temperature Range (Delta T)</text>
  <text x="400" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Units: deg C | Earth 0.05° Land vs. Moon South Pole vs. Mars Landing Sites</text>

  <!-- Grid lines -->
  <line x1="140" y1="80" x2="140" y2="300" stroke="#334155" stroke-width="1"/>
  <line x1="720" y1="80" x2="720" y2="300" stroke="#334155" stroke-width="1"/>
  <line x1="140" y1="300" x2="720" y2="300" stroke="#64748b" stroke-width="2"/>

  <!-- Axis ticks -->
  <text x="140" y="322" fill="#94a3b8" font-size="11" text-anchor="middle">-6.2</text>
  <text x="430" y="322" fill="#94a3b8" font-size="11" text-anchor="middle">73.0</text>
  <text x="720" y="322" fill="#94a3b8" font-size="11" text-anchor="middle">152.2</text>

  <!-- Row 1: Earth Land (0.05 deg Grid) -->
  <text x="25" y="115" fill="#38bdf8" font-size="13" font-weight="600">Earth Land (Global)</text>
  <line x1="166.36363636363637" y1="110" x2="242.59848484848487" y2="110" stroke="#38bdf8" stroke-width="2"/>
  <rect x="187.6010101010101" y="98" width="20.138888888888914" height="24" fill="#0284c7" opacity="0.4" rx="4"/>
  <line x1="197.3482323232323" y1="94" x2="197.3482323232323" y2="126" stroke="#bae6fd" stroke-width="3"/>
  <text x="197.3482323232323" y="90" fill="#bae6fd" font-size="11" text-anchor="middle">Med: 9.5</text>

  <!-- Row 2: Moon South Pole (85S-90S) -->
  <text x="25" y="165" fill="#e2e8f0" font-size="13" font-weight="600">Moon South Pole</text>
  <line x1="309.16666666666674" y1="160" x2="693.6363636363636" y2="160" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="602.0959595959596" cy="160" r="7" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <text x="602.0959595959596" y="148" fill="#f8fafc" font-size="11" text-anchor="middle">120.0</text>

  <!-- Row 3: Mars Jezero Crater -->
  <text x="25" y="215" fill="#f97316" font-size="13" font-weight="600">Mars Jezero Crater</text>
  <line x1="426.3383838383839" y1="210" x2="470.2777777777778" y2="210" stroke="#f97316" stroke-width="2"/>
  <circle cx="450.5050505050505" cy="210" r="7" fill="#ea580c" stroke="#ffedd5" stroke-width="2"/>
  <text x="450.5050505050505" y="198" fill="#ffedd5" font-size="11" text-anchor="middle">78.6</text>

  <!-- Row 4: Mars Oxia Planum -->
  <text x="25" y="265" fill="#ef4444" font-size="13" font-weight="600">Mars Oxia Planum</text>
  <line x1="408.03030303030306" y1="260" x2="448.3080808080809" y2="260" stroke="#ef4444" stroke-width="2"/>
  <circle cx="427.80303030303037" cy="260" r="7" fill="#dc2626" stroke="#fee2e2" stroke-width="2"/>
  <text x="427.80303030303037" y="248" fill="#fee2e2" font-size="11" text-anchor="middle">72.4</text>

  <!-- Legend -->
  <rect x="220" y="340" width="360" height="26" fill="#1e293b" rx="6"/>
  <rect x="235" y="348" width="14" height="10" fill="#0284c7" opacity="0.6"/>
  <text x="255" y="357" fill="#cbd5e1" font-size="10">Earth IQR (p25-p75)</text>
  <circle cx="390" cy="353" r="5" fill="#f8fafc"/>
  <text x="402" y="357" fill="#cbd5e1" font-size="10">Moon Pole</text>
  <circle cx="485" cy="353" r="5" fill="#f97316"/>
  <text x="497" y="357" fill="#cbd5e1" font-size="10">Mars Sites</text>
</svg>