  <line x1="720" y1="80" x2="720" y2="300" stroke="#334155" stroke-width="1"/>
  <line x1="140" y1="300" x2="720" y2="300" stroke="#64748b" stroke-width="2"/>

  <!-- Axis ticks -->
  <text x="140" y="322" fill="#94a3b8" font-size="11" text-anchor="middle">-251.2</text>
