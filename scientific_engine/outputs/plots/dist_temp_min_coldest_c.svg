  <text x="400" y="36" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="bold">Cold Extreme / Minimum Temperature</text>
  <text x="400" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Units: deg C | Earth 0.05° Land vs. Moon South Pole vs. Mars Landing Sites</text>

  <!-- Grid lines -->
