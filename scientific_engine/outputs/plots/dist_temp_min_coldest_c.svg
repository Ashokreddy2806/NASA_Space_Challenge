  <rect x="568.351735287036" y="98" width="77.80414817872258" height="24" fill="#0284c7" opacity="0.4" rx="4"/>
  <line x1="597.119320331579" y1="94" x2="597.119320331579" y2="126" stroke="#bae6fd" stroke-width="3"/>
  <text x="597.119320331579" y="90" fill="#bae6fd" font-size="11" text-anchor="middle">Med: -22.1</text>

  <!-- Row 2: Moon South Pole (85S-90S) -->
  <text x="25" y="165" fill="#e2e8f0" font-size="13" font-weight="600">Moon South Pole</text>
  <line x1="166.36363636363637" y1="160" x2="212.24813400749838" y2="160" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="176.03928043201594" cy="160" r="7" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <text x="176.03928043201594" y="148" fill="#f8fafc" font-size="11" text-anchor="middle">-233.2</text>

  <!-- Row 3: Mars Jezero Crater -->
  <text x="25" y="215" fill="#f97316" font-size="13" font-weight="600">Mars Jezero Crater</text>
  <line x1="455.63546933580983" y1="210" x2="471.59529460324006" y2="210" stroke="#f97316" stroke-width="2"/>
  <circle cx="462.11914835070337" cy="210" r="7" fill="#ea580c" stroke="#ffedd5" stroke-width="2"/>
  <text x="462.11914835070337" y="198" fill="#ffedd5" font-size="11" text-anchor="middle">-89.8</text>

  <!-- Row 4: Mars Oxia Planum -->
  <text x="25" y="265" fill="#ef4444" font-size="13" font-weight="600">Mars Oxia Planum</text>
  <line x1="443.6656003852371" y1="260" x2="461.6204038110962" y2="260" stroke="#ef4444" stroke-width="2"/>
  <circle cx="451.7452619268737" cy="260" r="7" fill="#dc2626" stroke="#fee2e2" stroke-width="2"/>
