  thermal_cycling:
    description: "Prioritizes diurnal temperature swings, annual thermal range, and thermal extremes"
    weights:
      temp_diurnal_range_c: 0.35
      temp_annual_range_c: 0.25
      temp_mean_c: 0.20
      temp_min_coldest_c: 0.10
      slope_20km_deg: 0.05
      roughness_10km_m: 0.05
