# Weight configurations and presets for similarity engine

presets:
  # Preset 1: Rover mobility (terramechanics, slope navigation, obstacle avoidance)
  rover_mobility:
    description: "Prioritizes terrain traverse feasibility, chassis clearance, slope gradients, and multi-scale roughness"
    weights:
      slope_20km_deg: 0.30
      roughness_5km_m: 0.20
      roughness_10km_m: 0.15
      roughness_20km_m: 0.10
      relief_20km_m: 0.15
      hurst_2_32km: 0.10
      temp_mean_c: 0.00
